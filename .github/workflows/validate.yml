name: Validate game
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
      - name: Browser controls and recovery
        run: |
          python3 -m venv /tmp/butterfly-qa
          /tmp/butterfly-qa/bin/pip install playwright==1.62.0
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/butterfly-http.log 2>&1 &
          /tmp/butterfly-qa/bin/python tests/browser.py
